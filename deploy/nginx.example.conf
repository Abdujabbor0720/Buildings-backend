# ─────────────────────────────────────────────────────────────────────
#  NGINX — qurilish nazorati tizimi backendi uchun teskari proksi
#
#  Serverga qo'yiladigan joy:
#     /etc/nginx/sites-available/buildings-backend
#  va havola:
#     ln -s /etc/nginx/sites-available/buildings-backend \
#           /etc/nginx/sites-enabled/
#
#  ⚠️ BU FAYL NIMA UCHUN REPODA TURADI
#  100 MB lik fayl yuklash ilovaning emas, PROKSINING sozlamasiga ham
#  bog'liq. Sozlama faqat serverda qolsa, keyingi ko'chirishda yoki
#  boshqa odam o'rnatganda u esdan chiqadi va yuklash sababi noaniq
#  `413` bilan yiqiladi. Shuning uchun talab kod bilan birga yuradi.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name api.example.uz;          # ← o'z domeningiz

    # ⚠️ ENG MUHIM QATOR.
    # Nginx'ning standart chegarasi — 1 MB. Usiz 100 MB lik video
    # Node'ga YETIB BORMAYDI: nginx uni o'zi `413 Request Entity Too
    # Large` bilan rad etadi va ilova jurnalida hech narsa ko'rinmaydi.
    # 110M — 100 MB fayl + multipart qobig'i uchun zaxira.
    client_max_body_size 110M;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ Sekin mobil internetdan 100 MB yuklash daqiqalab ketadi.
        # Standart 60 soniya bilan ulanish yuklash o'rtasida uziladi.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        client_body_timeout   600s;

        # ⚠️ Nginx sukut bo'yicha butun so'rovni DISKKA yig'ib, keyin
        # ilovaga uzatadi. Natijada: (1) har yuklov diskka ikki marta
        # yoziladi, (2) foydalanuvchi progressni ko'rmaydi — 100% da
        # turib, yana shuncha kutadi. `off` — oqim to'g'ridan-to'g'ri
        # o'tadi, backend esa uni Spaces'ga bo'laklab yuboradi.
        proxy_request_buffering off;
    }
}

# ─────────────────────────────────────────────────────────────────────
#  FRONTEND — statik build (dist/)
#
#  `vite preview` ishlab chiqarish uchun mo'ljallanmagan: u bitta
#  Node jarayoni bo'lib, nginx bergan tezlik va keshni bermaydi.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name buildings.example.uz;    # ← o'z domeningiz

    root /var/www/buildings/buildings-front/dist;
    index index.html;

    # Xeshlangan fayl nomlari (app-a1b2c3.js) — abadiy keshlanadi.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ⚠️ SPA uchun majburiy: `/objects/123` kabi manzil serverda fayl
    # emas. Usiz sahifani YANGILAGANDA 404 chiqadi — eng ko'p
    # uchraydigan SPA deploy xatosi.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
