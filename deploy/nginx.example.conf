# ─────────────────────────────────────────────────────────────────────
#  NGINX — BACKEND (API)
#
#  Domen:  qurilish-api.mysrv.uz   →  127.0.0.1:3333
#
#  Qo'yiladigan joy:
#     /etc/nginx/sites-available/qurilish-api
#     ln -s /etc/nginx/sites-available/qurilish-api /etc/nginx/sites-enabled/
#     nginx -t && systemctl reload nginx
#
#  HTTPS (bir marta):
#     certbot --nginx -d qurilish-api.mysrv.uz
#  Certbot quyidagi blokni o'zi 443 ga ko'chiradi va 80 → 443
#  yo'naltirishini qo'shadi.
#
#  ⚠️ BU FAYL NIMA UCHUN REPODA TURADI
#  100 MB fayl yuklash ilovaning emas, PROKSINING sozlamasiga ham
#  bog'liq. Sozlama faqat serverda qolsa, keyingi ko'chirishda yoki
#  boshqa odam o'rnatganda esdan chiqadi va yuklash sababi noaniq
#  `413` bilan yiqiladi. Shuning uchun talab kod bilan birga yuradi.
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name qurilish-api.mysrv.uz;

    # ⚠️ ENG MUHIM QATOR.
    # Nginx'ning standart chegarasi — 1 MB. Usiz 100 MB lik video
    # Node'ga YETIB BORMAYDI: nginx uni o'zi `413 Request Entity Too
    # Large` bilan rad etadi va ilova jurnalida hech narsa ko'rinmaydi.
    # 110M — 100 MB fayl + multipart qobig'i uchun zaxira.
    client_max_body_size 110M;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ Sekin mobil internetdan 100 MB yuklash daqiqalab ketadi.
        # Standart 60 soniya bilan ulanish yuklash o'rtasida uziladi.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        client_body_timeout   600s;

        # ⚠️ Nginx sukut bo'yicha butun so'rovni DISKKA yig'ib, keyin
        # ilovaga uzatadi. Natijada: (1) har yuklov diskka ikki marta
        # yoziladi, (2) foydalanuvchi progressni ko'rmaydi — 100% da
        # turib, yana shuncha kutadi. `off` — oqim to'g'ridan-to'g'ri
        # o'tadi, backend esa uni Spaces'ga bo'laklab yuboradi.
        proxy_request_buffering off;
    }
}

# ─────────────────────────────────────────────────────────────────────
#  ⚠️ FRONTEND ALOHIDA DOMENDA (qurilish.mysrv.uz)
#
#  Shuning uchun backendda `CORS_ORIGINS` TO'G'RI bo'lishi SHART:
#
#     CORS_ORIGINS=https://qurilish.mysrv.uz
#
#  `http://` yoki oxirida `/` bilan yozilsa mos kelmaydi va brauzer
#  har so'rovni bloklaydi — bunda server jurnalida xato KO'RINMAYDI,
#  chunki so'rov brauzerning o'zida to'xtaydi.
#
#  Frontend nginx sozlamasi o'z repozitoriysida:
#     Buildings-front/deploy/nginx.example.conf
# ─────────────────────────────────────────────────────────────────────
